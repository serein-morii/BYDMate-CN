name: CN build

on:
  push:
    branches: [cn/main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the full unit test suite before building'
        type: boolean
        default: false

concurrency:
  group: cn-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # Pushes get a fast APK; the full suite runs on demand (the fork keeps the
      # upstream rule: a full local run gates every release push).
      - name: Unit tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK (debug-signed, installable)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-CN-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
