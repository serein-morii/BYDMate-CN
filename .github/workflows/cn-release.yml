name: CN release

on:
  push:
    tags: ['v*-cn.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Materialize the signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PROPERTIES repository secrets first."
            exit 1
          fi
          # app/release.jks + root keystore.properties is the layout build.gradle.kts
          # expects: the properties file at the repo root, storeFile resolved by the
          # :app project, so a bare file name lands in app/.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Check the APK is actually signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          if "$ANDROID_SDK_ROOT/build-tools"/*/apksigner verify --print-certs "$APK" | grep -q "CN=BYDMate-CN"; then
            "$ANDROID_SDK_ROOT/build-tools"/*/apksigner verify --print-certs "$APK" | head -2
          else
            echo "::error::$APK is not signed with the release key"; exit 1
          fi

      - name: Rename, checksum, notes
        id: out
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls app/build/outputs/apk/release/*.apk)
          OUT="BYDMate-${TAG}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          NOTES="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then NOTES=""; fi
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(release create "$GITHUB_REF_NAME" "${{ steps.out.outputs.apk }}" "${{ steps.out.outputs.apk }}.sha256"
            --title "BYDMate-CN ${GITHUB_REF_NAME}" --latest)
          if [ -n "${{ steps.out.outputs.notes }}" ]; then
            ARGS+=(--notes-file "${{ steps.out.outputs.notes }}")
          else
            ARGS+=(--notes "BYDMate-CN ${GITHUB_REF_NAME}")
          fi
          gh "${ARGS[@]}"

      - name: Upload APK artifact (fallback if release creation failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-CN-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
